name: Native iOS (Swift)

# The native Swift app. Two jobs:
#  - sim-tests (Linux, cheap): `swift test` on PistonForgeKit, the pure-Swift simulation.
#    Runs on every push to any branch that touches Native/ or this file.
#  - app (macOS, about ten times the Linux price per minute): generate the Xcode project,
#    compile once, run the UI tests on an iPhone and an iPad simulator from that one build,
#    export their screenshots (the only way to see the screens without a Mac), then build an
#    unsigned .ipa for sideloading. Runs only on demand or on main, and as one job, because
#    macOS minutes are rounded up per job.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Native/PistonForgeKit
        env:
          PF_WAV_DIR: ${{ github.workspace }}/engine-sounds
        run: swift test
      - name: Upload engine sounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-sounds
          path: engine-sounds/
          if-no-files-found: ignore

  app:
    needs: sim-tests
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 50
    # Only the Mac job cancels an older run on the same branch; Linux runs are cheap and each
    # commit's result is kept.
    concurrency:
      group: native-app-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Native
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile app and UI tests once
        run: xcodebuild -project PistonForge.xcodeproj -scheme PistonForge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim build-for-testing

      - name: UI tests on iPhone and iPad
        run: |
          set -o pipefail
          xcrun simctl list devices available
          status=0
          for kind in iphone ipad; do
            udid=$(xcrun simctl list devices available -j | python3 ci/pick_sim.py "$kind")
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcodebuild -project PistonForge.xcodeproj -scheme PistonForge -derivedDataPath build/sim \
              -destination "id=$udid" -resultBundlePath "build/$kind.xcresult" test-without-building || status=1
            mkdir -p "shots/$kind"
            xcrun xcresulttool export attachments --path "build/$kind.xcresult" --output-path "shots/$kind" || status=1
            python3 ci/name_attachments.py "shots/$kind"
            xcrun simctl shutdown "$udid" || true
          done
          ls -lR shots
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshots
          path: Native/shots/
          if-no-files-found: warn

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-xcresult
          path: Native/build/*.xcresult
          if-no-files-found: ignore

      - name: Build for iPhone (unsigned)
        run: xcodebuild -project PistonForge.xcodeproj -scheme PistonForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned .ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PistonForge.app build/ipa/Payload/
          cd build/ipa && zip -qry PistonForge-native-unsigned.ipa Payload
          ls -lh PistonForge-native-unsigned.ipa
          unzip -l PistonForge-native-unsigned.ipa | grep -E "PrivacyInfo|Assets.car|PistonForge$"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PistonForge-native-unsigned-ipa
          path: Native/build/ipa/PistonForge-native-unsigned.ipa
          if-no-files-found: error
