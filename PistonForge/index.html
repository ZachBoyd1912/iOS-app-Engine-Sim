<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0d0e" />
    <meta name="description" content="Piston Forge is an original 3D engine-building, remapping and proving-grounds sandbox. Build the engine, fit the body, tune the ECU, then prove it on the dyno and the strip." />
    <title>Piston Forge</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/ManusCC0-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./fonts/ManusCC0-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <canvas id="game" aria-label="Piston Forge 3D workshop"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16.5" fill="none" stroke="currentColor" stroke-width="2.6" />
          <path d="M20 7.2v8.1" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" />
          <circle cx="24.8" cy="20.8" r="3" fill="currentColor" />
          <path d="M23.2 22.7 12.2 31.4" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" />
        </svg>
      </div>
      <div class="boot-type">PISTON <b>FORGE</b></div>
      <div class="boot-track"><i></i></div>
      <div class="boot-line"><span>WARMING THE BAY</span><em>BUILD · MAP · PROVE</em></div>
    </div>
    <noscript><div class="noscript">Piston Forge needs JavaScript and WebGL.</div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
